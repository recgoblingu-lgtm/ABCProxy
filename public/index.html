
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090d">
  <title>AbC</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #09090d;
      color: #f5f5f7;
      font-family: Inter, system-ui, sans-serif;
    }

    header {
      height: 64px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #24242e;
    }

    .logo {
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .logo span { color: #a78bfa; }

    main {
      width: min(650px, calc(100% - 32px));
      margin: 0 auto;
      padding-top: 25vh;
    }

    nav {
      display: flex;
      gap: 24px;
      border-bottom: 1px solid #292933;
      margin-bottom: 18px;
    }

    .tab {
      border: 0;
      border-bottom: 2px solid transparent;
      background: none;
      color: #888896;
      padding: 12px 2px;
      font-size: 14px;
      cursor: pointer;
    }

    .tab.active {
      color: #f5f5f7;
      border-bottom-color: #a78bfa;
    }

    form {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #14141b;
      border: 1px solid #30303d;
      border-radius: 12px;
      padding: 7px 8px 7px 15px;
    }

    form:focus-within {
      border-color: #a78bfa;
    }

    input {
      flex: 1;
      min-width: 0;
      background: transparent;
      color: #f5f5f7;
      border: 0;
      outline: none;
      padding: 10px 0;
      font-size: 14px;
    }

    input::placeholder { color: #777783; }

    .go {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 9px;
      background: #a78bfa;
      color: #09090d;
      cursor: pointer;
      font-size: 20px;
    }

    .go:hover { background: #c4b5fd; }

    #message {
      color: #9292a3;
      font-size: 13px;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    #message:empty { display: none; }

    #about {
      display: none;
      padding: 18px 0;
      color: #9292a3;
      font-size: 14px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 18px;
      color: #555563;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      main { padding-top: 20vh; }
      header { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Ab<span>C</span></div>
  </header>

  <main>
    <nav>
      <button class="tab active" data-tab="search">Search</button>
      <button class="tab" data-tab="about">About</button>
    </nav>

    <section id="search">
      <form id="searchForm">
        <input
          id="url"
          type="text"
          placeholder="Search or enter URL"
          aria-label="Search or enter URL"
          autocomplete="url"
          required
        >
        <button class="go" type="submit" aria-label="Go">→</button>
      </form>
      <div id="message" role="status"></div>
    </section>

    <section id="about">
      AbC Proxy
    </section>
  </main>

  <footer>AbC</footer>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const search = document.getElementById("search");
    const about = document.getElementById("about");
    const input = document.getElementById("url");
    const message = document.getElementById("message");

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(item => item.classList.remove("active"));
        tab.classList.add("active");

        search.style.display =
          tab.dataset.tab === "search" ? "block" : "none";

        about.style.display =
          tab.dataset.tab === "about" ? "block" : "none";
      });
    });

    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventDefault();

      let value = input.value.trim();

      if (!/^https?:\/\//i.test(value)) {
        if (/^[^\s.]+\s+[^\s]+/.test(value)) {
          value = "https://www.google.com/search?q=" +
            encodeURIComponent(value);
        } else {
          value = "https://" + value;
        }
      }

      try {
        const url = new URL(value);

        if (!["http:", "https:"].includes(url.protocol)) {
          throw new Error();
        }

        message.textContent = "Loading...";
        window.location.href = "/proxy?url=" +
          encodeURIComponent(url.href);
      } catch {
        message.textContent = "Enter a valid URL.";
      }
    });
  </script>
</body>
</html>
